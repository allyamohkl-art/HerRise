<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | HerRise</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #100b10;
            color: #f5e8ee;
            font-family: Arial, sans-serif;
        }
.upload-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.upload-buttons label {
    background: rgba(255, 255, 255, 0.04);
    color: #f5e8ee;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
}

.upload-buttons input {
    display: none;
}
   
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    border-bottom: 1px solid #382532;
}

.logo {
    color: #e8a9c2;
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
}

.back-link {
    color: #f5e8ee;
    text-decoration: none;
}

main {
    width: 90%;
    max-width: 1000px;
    margin: 45px auto;
}

h1 {
    color: #e8a9c2;
}

.subtitle {
    color: #bdaab5;
}

.profile-card {
    background: #1c121b;
    border: 1px solid #382532;
    border-radius: 18px;
    overflow: hidden;
}

.profile-banner {
    height: 220px;
    background: linear-gradient(120deg, #593449, #a66b87, #352039);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff0f6;
    font-size: 22px;
}

.profile-info {
    padding: 0 25px 25px;
}

.profile-avatar {
    width: 100px;
    height: 100px;
    margin-top: -50px;
    border-radius: 50%;
    background: #30202e;
    border: 4px solid #1c121b;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e8a9c2;
    font-size: 38px;
    position: relative;
}

.edit-button,
.profile-editor button {
    background: #63394f;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 12px;
}

.profile-editor {
    margin-top: 20px;
    padding: 20px;
    background: #241824;
    border-radius: 14px;
}

.profile-editor label {
    display: block;
    margin: 15px 0 7px;
    color: #e8a9c2;
}

.profile-editor input,
.profile-editor textarea {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #63394f;
    background: #100b10;
    color: white;
    font: inherit;
}

.profile-editor textarea {
    min-height: 100px;
    resize: vertical;
}

.interests-card {
    margin-top: 25px;
    padding: 25px;
    background: #1c121b;
    border: 1px solid #382532;
    border-radius: 18px;
}

.interests-card h2 {
    color: #e8a9c2;
    margin-top: 0;
}

.interests-card p {
    color: #bdaab5;
}

.interests-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.interest-tag {
    background: #382532;
    color: #ffe6f0;
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 13px;
}

.interest-editor {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.interest-editor input {
    flex: 1;
    min-width: 180px;
    padding: 12px;
    border: 1px solid #63394f;
    border-radius: 9px;
    background: #100b10;
    color: white;
    font: inherit;
}

.interest-editor button {
    background: #63394f;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 9px;
    cursor: pointer;
}

.badges-card {
    margin-top: 25px;
    padding: 25px;
    background: #1c121b;
    border: 1px solid #382532;
    border-radius: 18px;
}

.badges-card h2 {
    color: #e8a9c2;
    margin-top: 0;
}

.badges-card p {
    color: #bdaab5;
}

.badges-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

.badge-option {
    background: #30202e;
    color: #e8a9c2;
    border: 1px solid #63394f;
    padding: 11px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.badge-option.selected {
    background: #63394f;
    color: white;
    border-color: #e8a9c2;
}

.themes-card {
    margin-top: 25px;
    padding: 25px;
    background: #1c121b;
    border: 1px solid #382532;
    border-radius: 18px;
}

.themes-card h2 {
    color: #e8a9c2;
    margin-top: 0;
}

.themes-card p {
    color: #bdaab5;
}

.themes-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

.theme-option {
    background: #30202e;
    color: #f5e8ee;
    border: 1px solid #63394f;
    padding: 13px 17px;
    border-radius: 12px;
    cursor: pointer;
}

.theme-option:hover {
    background: #63394f;
}


.avatar-frame {
    width: 112px;
    height: 112px;
    margin-top: -56px;
    border-radius: 50%;
    padding: 5px;
    position: relative;
    z-index: 2;
}

.avatar-frame .profile-avatar {
    width: 100%;
    height: 100%;
    margin: 0;
    border: 3px solid #1c121b;
}

.avatar-frame.classic {
    border: 2px solid #e8a9c2;
}

.avatar-frame.vintage {
    border: 3px double #d9b28f;
    box-shadow: 0 0 0 3px #63394f;
}

.avatar-frame.glow {
    border: 2px solid #e8a9c2;
    box-shadow: 0 0 14px #e8a9c2;
}

.frame-options {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

.frame-options button {
    background: rgba(255, 255, 255, 0.04);
    color: #f5e8ee;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 9px 13px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.upload-buttons label:hover,
.frame-options button:hover {
    background: rgba(255, 255, 255, 0.10);
}

@media (max-width: 600px) {
    main {
        width: 92%;
        margin: 20px auto;
    }

    .top-bar {
        padding: 14px 5%;
    }

    .profile-banner {
        height: 150px;
    }

    .profile-info {
        padding: 18px;
    }

    .upload-buttons,
    .frame-options,
    .themes-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .upload-buttons label,
    .frame-options button,
    .theme-option {
        font-size: 12px;
        padding: 9px 10px;
    }

    .interest-editor {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .interest-editor input {
        min-width: 0;
        flex: 1;
    }

    .badges-list,
    .interests-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
}

   </style>
</head>

<body>

    <header class="top-bar">
        <a href="index.html" class="logo">HerRise ✧</a>
        <a href="discover.html" class="back-link">Discover</a>
    </header>

    <main>
        <section class="profile-card">

    <div class="profile-banner">
        <span>My little universe ✧</span>
    </div>

    <div class="profile-info">
        <div class="avatar-frame classic" id="avatarFrame">
    <div class="profile-avatar">♡</div>
</div>

<div class="frame-options">
    <button onclick="changeFrame('classic')">♡ Classic</button>
    <button onclick="changeFrame('vintage')">✧ Vintage</button>
    <button onclick="changeFrame('glow')">✨ Glow</button>
</div>
<div class="upload-buttons">
    <label>
        Change Profile Photo
        <input type="file" id="avatarInput" accept="image/*">
    </label>

    <label>
        Change Banner
        <input type="file" id="bannerInput" accept="image/*">
    </label>
</div>

        <h1 id="profileName">Your Name</h1>
<p class="subtitle" id="profileBio">A little space that is yours.</p>

<button class="edit-button" onclick="toggleEditor()">
    Edit Profile ✧
</button>

<div id="profileEditor" class="profile-editor" style="display:none;">

    <label>Display Name</label>
    <input type="text" id="nameInput" placeholder="Your name">

    <label>About Me</label>
    <textarea id="bioInput" placeholder="Tell us about yourself..."></textarea>

    <button onclick="saveProfile()">Save Profile</button>

</div>

</section>

<section class="interests-card">

    <h2>My Interests ✧</h2>
    <p>Things I love and enjoy.</p>

    <div id="interestsList" class="interests-list">
        <span class="interest-tag">♡ Programming</span>
        <span class="interest-tag">♡ Photography</span>
        <span class="interest-tag">♡ Music</span>
    </div>

    <div class="interest-editor">
        <input
            type="text"
            id="interestInput"
            placeholder="Add a new interest..."
        >

        <button onclick="addInterest()">Add +</button>
    </div>

</section>

<section class="badges-card">

    <h2>My Badges ✧</h2>
    <p>Choose the little things that represent you.</p>

    <div class="badges-list" id="badgesList">

        <button class="badge-option" onclick="toggleBadge(this)">♡ Dreamer</button>
        <button class="badge-option" onclick="toggleBadge(this)">✧ Creative Soul</button>
        <button class="badge-option" onclick="toggleBadge(this)">☾ Night Owl</button>
        <button class="badge-option" onclick="toggleBadge(this)">🌷 Gentle Heart</button>
        <button class="badge-option" onclick="toggleBadge(this)">★ Explorer</button>
        <button class="badge-option" onclick="toggleBadge(this)">♡ Book Lover</button>

    </div>

</section>

<section class="themes-card">

    <h2>Choose Your Theme ✧</h2>
    <p>Make your profile feel like you.</p>

    <div class="themes-list">

        <button class="theme-option" onclick="changeTheme('coquette')">
            ♡ Dark Coquette
        </button>

        <button class="theme-option" onclick="changeTheme('midnight')">
            ☾ Midnight
        </button>

        <button class="theme-option" onclick="changeTheme('vintage')">
            ✧ Soft Vintage
        </button>

        <button class="theme-option" onclick="changeTheme('sage')">
            🌿 Sage Garden
        </button>

    </div>

</section>

</main>

<script>
    const avatarInput = document.getElementById("avatarInput");
    const bannerInput = document.getElementById("bannerInput");

    const avatar = document.querySelector(".profile-avatar");
    const banner = document.querySelector(".profile-banner");

    function saveImage(file, storageKey, element, isAvatar) {
    if (!file || !file.type.startsWith("image/")) return;

    if (file.size > 5 * 1024 * 1024) {
        alert("Please choose an image smaller than 5 MB.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function () {
        const image = new Image();

        image.onload = function () {
            const canvas = document.createElement("canvas");

            const maxSize = isAvatar ? 500 : 1400;
            const scale = Math.min(
                1,
                maxSize / Math.max(image.width, image.height)
            );

            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);

            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, canvas.width, canvas.height);

            const savedImage = canvas.toDataURL("image/jpeg", 0.8);

            try {
                localStorage.setItem(storageKey, savedImage);
                element.style.backgroundImage = `url("${savedImage}")`;
                element.style.backgroundSize = "cover";
                element.style.backgroundPosition = "center";

                if (isAvatar) {
                    element.textContent = "";
                } else {
                    element.querySelector("span").style.display = "none";
                }
            } catch (error) {
                alert("Storage is full. Please choose a smaller image.");
            }
        };

        image.src = reader.result;
    };

    reader.readAsDataURL(file);
}

avatarInput.addEventListener("change", function () {
    saveImage(
        this.files[0],
        "herRiseAvatar",
        avatar,
        true
    );
});

bannerInput.addEventListener("change", function () {
    saveImage(
        this.files[0],
        "herRiseBanner",
        banner,
        false
    );
});
        
function restoreSavedImages() {
    const savedAvatar = localStorage.getItem("herRiseAvatar");
    const savedBanner = localStorage.getItem("herRiseBanner");

    if (savedAvatar) {
        avatar.style.backgroundImage = `url("${savedAvatar}")`;
        avatar.style.backgroundSize = "cover";
        avatar.style.backgroundPosition = "center";
        avatar.textContent = "";
    }

    if (savedBanner) {
        banner.style.backgroundImage = `url("${savedBanner}")`;
        banner.style.backgroundSize = "cover";
        banner.style.backgroundPosition = "center";

        const bannerText = banner.querySelector("span");
        if (bannerText) bannerText.style.display = "none";
    }
}

window.addEventListener("DOMContentLoaded", restoreSavedImages);

function toggleEditor() {
    const editor = document.getElementById("profileEditor");

    if (editor.style.display === "none") {
        editor.style.display = "block";

        document.getElementById("nameInput").value =
            document.getElementById("profileName").textContent;

        document.getElementById("bioInput").value =
            document.getElementById("profileBio").textContent;
    } else {
        editor.style.display = "none";
    }
}

function saveProfile() {
    const name = document.getElementById("nameInput").value.trim();
    const bio = document.getElementById("bioInput").value.trim();

    if (name === "") {
        alert("Please enter your name!");
        return;
    }

    document.getElementById("profileName").textContent = name;
    document.getElementById("profileBio").textContent = bio;

    localStorage.setItem("herRiseProfileName", name);
    localStorage.setItem("herRiseProfileBio", bio);

    document.getElementById("profileEditor").style.display = "none";
}

window.addEventListener("DOMContentLoaded", function () {
    const savedName = localStorage.getItem("herRiseProfileName");
    const savedBio = localStorage.getItem("herRiseProfileBio");

    if (savedName) {
        document.getElementById("profileName").textContent = savedName;
    }

    if (savedBio !== null) {
        document.getElementById("profileBio").textContent = savedBio;
    }
});

let interests = JSON.parse(
    localStorage.getItem("herRiseInterests") || '["Programming", "Photography", "Music"]'
);

function renderInterests() {
    const list = document.getElementById("interestsList");
    list.innerHTML = "";

    interests.forEach(function (interest, index) {
        const tag = document.createElement("span");
        tag.className = "interest-tag";
        tag.textContent = "♡ " + interest + " ";

        const removeButton = document.createElement("button");
        removeButton.textContent = "×";
        removeButton.style.background = "none";
        removeButton.style.border = "none";
        removeButton.style.color = "#e8a9c2";
        removeButton.style.cursor = "pointer";

        removeButton.onclick = function () {
            interests.splice(index, 1);
            saveInterests();
        };

        tag.appendChild(removeButton);
        list.appendChild(tag);
    });
}

function addInterest() {
    const input = document.getElementById("interestInput");
    const value = input.value.trim();

    if (value === "") return;

    if (interests.some(item => item.toLowerCase() === value.toLowerCase())) {
        alert("This interest already exists!");
        return;
    }

    interests.push(value);
    input.value = "";
    saveInterests();
}

function saveInterests() {
    localStorage.setItem("herRiseInterests", JSON.stringify(interests));
    renderInterests();
}

window.addEventListener("DOMContentLoaded", renderInterests);

let selectedBadges = JSON.parse(
    localStorage.getItem("herRiseBadges") || "[]"
);

function renderBadges() {
    const buttons = document.querySelectorAll(".badge-option");

    buttons.forEach(function (button) {
        const badgeName = button.textContent.trim();

        button.classList.toggle(
            "selected",
            selectedBadges.includes(badgeName)
        );
    });
}

function toggleBadge(button) {
    const badgeName = button.textContent.trim();

    if (selectedBadges.includes(badgeName)) {
        selectedBadges = selectedBadges.filter(
            badge => badge !== badgeName
        );
    } else {
        selectedBadges.push(badgeName);
    }

    localStorage.setItem(
        "herRiseBadges",
        JSON.stringify(selectedBadges)
    );

    renderBadges();
}

window.addEventListener("DOMContentLoaded", renderBadges);

const themes = {
    coquette: {
        page: "#100b10",
        card: "#1c121b",
        accent: "#e8a9c2",
        border: "#63394f",
        text: "#f5e8ee"
    },

    midnight: {
        page: "#090b18",
        card: "#15172b",
        accent: "#a99bff",
        border: "#51458a",
        text: "#eeeaff"
    },

    vintage: {
        page: "#211914",
        card: "#35271f",
        accent: "#e6b99e",
        border: "#80614e",
        text: "#fff0df"
    },

    sage: {
        page: "#101b16",
        card: "#1d3025",
        accent: "#b6d6b5",
        border: "#52785e",
        text: "#eff8ed"
    }
};

function changeTheme(themeName) {
    const theme = themes[themeName];

    if (!theme) return;

    document.body.style.backgroundColor = theme.page;
    document.body.style.color = theme.text;

    document.querySelectorAll(
        ".profile-card, .interests-card, .badges-card, .themes-card"
    ).forEach(function (card) {
        card.style.backgroundColor = theme.card;
        card.style.borderColor = theme.border;
    });

    document.querySelectorAll("h1, h2, .logo").forEach(function (item) {
        item.style.color = theme.accent;
    });

    localStorage.setItem("herRiseProfileTheme", themeName);
}

window.addEventListener("DOMContentLoaded", function () {
    const savedTheme = localStorage.getItem("herRiseProfileTheme");

    if (savedTheme) {
        changeTheme(savedTheme);
    }
});

function changeFrame(frameName) {
    const frame = document.getElementById("avatarFrame");

    frame.classList.remove("classic", "vintage", "glow");
    frame.classList.add(frameName);

    localStorage.setItem("herRiseAvatarFrame", frameName);
}

window.addEventListener("DOMContentLoaded", function () {
    const savedFrame = localStorage.getItem("herRiseAvatarFrame");

    if (savedFrame) {
        changeFrame(savedFrame);
    }
});

</script>

</body>
</html>

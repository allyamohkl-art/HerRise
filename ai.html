<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerRise | My AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #100b10;
      color: #f5e8ee;
    }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 8%;
  border-bottom: 1px solid #392432;
}

header h2,
header a {
  color: #e8a9c2;
}

header a {
  text-decoration: none;
}

main {
  text-align: center;
  padding: 60px 20px;
}

main h1 {
  color: #e8a9c2;
}

.ai-options {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin: 30px;
}

.ai-options button {
  background: #1c121b;
  color: #e8a9c2;
  border: 1px solid #493040;
  border-radius: 15px;
  padding: 18px 30px;
  cursor: pointer;
  font-size: 17px;
}

.ai-options button:hover {
  border-color: #e8a9c2;
  transform: translateY(-3px);
}

  </style>
</head>

<body>

  <header>
    <h2>HerRise ✧</h2>
    <a href="index.html">← الرئيسية</a>
  </header>

 <main>
  <h1>My AI, My Personality ✧</h1>
  <p>اختاري الشخصية التي تفضلينها لمساعدك الخاص.</p>

  <h2>Choose Your AI</h2>

  <div class="ai-options">
    <button onclick="chooseAI('Girl')">Girl ♡</button>
    <button onclick="chooseAI('Boy')">Boy ✧</button>
    <button onclick="chooseAI('Neutral')">Neutral ☾</button>
  </div>

  <p id="aiChoice">لم تختاري شخصية بعد.</p>
<h2>Give Your AI a Name ✧</h2>
<input type="text" id="aiName"
  placeholder="Write your AI's name..."
  style="background:#1c121b; color:#f5e8ee; border:1px solid #493040; padding:14px; border-radius:10px; width:220px;">

<input
  type="text"
  id="aiName"
  placeholder="Write your AI's name..."
  style="background:#1c121b; color:#f5e8ee; border:1px solid #493040; padding:14px; border-radius:10px; width:220px;"
>

<br><br>

<button onclick="saveAIName()"
  style="background:#e8a9c2; color:#1c121b; border:none; padding:12px 25px; border-radius:10px; cursor:pointer;">
  Save Name ♡
</button>

<p id="nameMessage"></p>
<h2>Choose AI Personality ✧</h2>

<div class="ai-options">
  <button onclick="choosePersonality('Calm & Kind')">Calm & Kind 🌷</button>
  <button onclick="choosePersonality('Funny')">Funny 😂</button>
  <button onclick="choosePersonality('Smart & Analytical')">Smart & Analytical 🧠</button>
  <button onclick="choosePersonality('Motivating & Direct')">Motivating & Direct 🔥</button>
</div>

<p id="personalityChoice">Choose your AI's personality.</p>
<h2>Choose Your Communication Style ✧</h2>

<div class="ai-options">
  <button onclick="chooseStyle('Listener & Thinker')">Listen & Think 🌷</button>
  <button onclick="chooseStyle('Encouraging')">Encourage Me ♡</button>
  <button onclick="chooseStyle('Study Partner')">Study With Me 📚</button>
  <button onclick="chooseStyle('Honest & Direct')">Be Honest With Me 🖤</button>
</div>

<p id="styleChoice">Choose how your AI communicates.</p>
</main>

<script>
function chooseAI(type) {
  localStorage.setItem("herRiseAIType", type);

  document.getElementById("aiChoice").textContent =
    "Your AI type: " + type + " ✧";
}

function saveAIName() {
  const name = document.getElementById("aiName").value.trim();

  if (name === "") {
    document.getElementById("nameMessage").textContent =
      "Please enter a name first ♡";
    return;
  }

  localStorage.setItem("herRiseAIName", name);

  document.getElementById("nameMessage").textContent =
    "Your AI's name is saved: " + name + " ✧";
}

function chooseStyle(style) {
  localStorage.setItem("herRiseAIStyle", style);

  document.getElementById("styleChoice").textContent =
    "Your AI communication style: " + style + " ✧";
}

function choosePersonality(personality) {
  localStorage.setItem("herRiseAIPersonality", personality);

  document.getElementById("personalityChoice").textContent =
    "Your AI personality: " + personality + " ✧";
}

// Restore saved choices
const savedType = localStorage.getItem("herRiseAIType");
const savedName = localStorage.getItem("herRiseAIName");
const savedPersonality = localStorage.getItem("herRiseAIPersonality");
const savedStyle = localStorage.getItem("herRiseAIStyle");

if (savedType) {
  document.getElementById("aiChoice").textContent =
    "Your AI type: " + savedType + " ✧";
}

if (savedName) {
  document.getElementById("aiName").value = savedName;
  document.getElementById("nameMessage").textContent =
    "Your AI's name: " + savedName + " ♡";
}

if (savedPersonality) {
  document.getElementById("personalityChoice").textContent =
    "Your AI personality: " + savedPersonality + " ✧";
}

if (savedStyle) {
  document.getElementById("styleChoice").textContent =
    "Your AI communication style: " + savedStyle + " ✧";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerRise | AI Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #100b10;
      color: #f5e8ee;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      border-bottom: 1px solid #392432;
    }

    header h2 {
      color: #e8a9c2;
    }

    header a {
      color: #e8a9c2;
      text-decoration: none;
    }

    main {
      text-align: center;
      padding: 50px 20px;
    }

    main h1 {
      color: #e8a9c2;
    }
.chat-message {
  display: table;
  max-width: 75%;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 16px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.user-bubble {
  margin-left: auto;
  background: #63394f;
  color: #fff0f6;
  border-bottom-right-radius: 4px;
}

.ai-bubble {
  margin-right: auto;
  background: #30202e;
  color: #f5e8ee;
  border-bottom-left-radius: 4px;
}

.message-time {
  display: block;
  font-size: 10px;
  opacity: 0.7;
  margin-top: 5px;
}
  </style>
</head>

<body>

  <header>
    <h2>HerRise ✧</h2>
    <a href="ai.html">← Back to AI Settings</a>
  </header>

  <main>
    <h1>My AI Chat ✧</h1>
<p id="assistantName" style="color:#e8a9c2;"></p>
    <p>Welcome to your personal space.</p>
<div style="margin:20px auto;">
  <label for="chatLanguage" style="color:#e8a9c2;">
    Choose Alex's Language ✧
  </label>

  <select id="chatLanguage" style="
    display:block;
    margin:12px auto;
    padding:12px 20px;
    background:#1c121b;
    color:#f5e8ee;
    border:1px solid #493040;
    border-radius:10px;
  ">
    <option value="auto">Auto Detect</option>
    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="tr">Türkçe</option>
    <option value="es">Español</option>
  </select>
</div>

<button onclick="clearChat()" style="
  background:transparent;
  color:#e8a9c2;
  border:1px solid #493040;
  border-radius:10px;
  padding:10px 18px;
  cursor:pointer;
  margin:15px auto;
">
  Clear Chat ✧
</button>

<div id="chatBox" style="
  max-width:700px;
  height:350px;
  margin:30px auto;
  background:#1c121b;
  border:1px solid #493040;
  border-radius:18px;
  padding:20px;
  overflow-y:auto;
  text-align:left;
">
  <p style="color:#e8a9c2;">
    ✧ Your AI is ready to chat!
  </p>
</div>

<div style="
  max-width:700px;
  margin:15px auto;
  display:flex;
  gap:10px;
">
  <input
    type="text"
    id="messageInput"
    placeholder="Write your message..."
    style="
      flex:1;
      padding:15px;
      background:#1c121b;
      color:#f5e8ee;
      border:1px solid #493040;
      border-radius:12px;
    "
  >

  <button onclick="sendMessage()" style="
    background:#e8a9c2;
    color:#1c121b;
    border:none;
    border-radius:12px;
    padding:15px 25px;
    cursor:pointer;
  ">
    Send ✧
  </button>
</div>

  </main>

<script>

let chatHistory = JSON.parse(
  localStorage.getItem("herRiseChatHistory") || "[]"
);

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function sendMessage() {
  const input = document.getElementById("messageInput");
  const chatBox = document.getElementById("chatBox");
  const message = input.value.trim();

  if (message === "") return;

  const aiName = localStorage.getItem("herRiseAIName") || "HerRise AI";
  const style = localStorage.getItem("herRiseAIStyle") || "Listener & Thinker";
  const personality = localStorage.getItem("herRiseAIPersonality") || "Calm & Kind";

  const languageMenu = document.getElementById("chatLanguage");
  const selectedLanguage = languageMenu.value;

  localStorage.setItem("herRiseChatLanguage", selectedLanguage);

  let lang = "en";

  if (selectedLanguage !== "auto") {
    lang = selectedLanguage;
  } else if (/[\u0600-\u06FF]/.test(message)) {
    lang = "ar";
  } else if (/\b(merhaba|selam|günaydın|nasılsın|teşekkürler|evet|hayır)\b/i.test(message) || /[çğıöşüİ]/i.test(message)) {
    lang = "tr";
  } else if (/\b(hola|gracias|buenos|buenas|adiós|cómo)\b/i.test(message) || /[ñáéíóúü¿¡]/i.test(message)) {
    lang = "es";
  }

  const replies = {
    ar: {
      default: "أنا هنا لأستمع إليكِ. أخبريني المزيد ♡",
      greeting: "أهلًا! سعيدة بوجودك هنا ♡"
    },
    en: {
      default: "I'm here to listen. Tell me more ♡",
      greeting: "Hello! I'm happy you're here ♡"
    },
    tr: {
      default: "Seni dinliyorum. Bana biraz daha anlat ♡",
      greeting: "Merhaba! Burada olmana sevindim ♡"
    },
    es: {
      default: "Estoy aquí para escucharte. Cuéntame más ♡",
      greeting: "¡Hola! Me alegra que estés aquí ♡"
    }
  };

  let reply = replies[lang].default;

  if (/^(hi|hello|hey|مرحبا|هلا|أهلا|merhaba|selam|hola)$/i.test(message)) {
    reply = replies[lang].greeting;
  }

  if (style === "Encouraging") {
    const extras = {
      ar: " أنتِ قادرة على التقدم خطوة بخطوة! ✨",
      en: " You can make progress one step at a time! ✨",
      tr: " Adım adım ilerleyebilirsin! ✨",
      es: " ¡Puedes avanzar paso a paso! ✨"
    };
    reply += extras[lang];
  }

  if (personality === "Funny") {
    const extras = {
      ar: " ولا ننسى أن نضيف بعض المرح! 😂",
      en: " Let's add a little fun too! 😂",
      tr: " Biraz eğlence de katalım! 😂",
      es: " ¡Añadamos un poco de diversión! 😂"
    };
    reply += extras[lang];
  }

  const now = new Date().toLocaleTimeString();

  chatHistory.push({
    sender: "You",
    message: message,
    time: now
  });

  chatHistory.push({
    sender: aiName,
    message: reply,
    time: now
  });

 localStorage.setItem(
  "herRiseChatHistory",
  JSON.stringify(chatHistory)
);

  const userMessage = document.createElement("div");
userMessage.className = "chat-message user-bubble";

userMessage.innerHTML = `
  <span>${escapeHTML(message)}</span>
  <small class="message-time">${now}</small>
`;

chatBox.appendChild(userMessage);

 const aiMessage = document.createElement("div");
aiMessage.className = "chat-message ai-bubble";

aiMessage.innerHTML = `
  <span>${escapeHTML(reply)}</span>
  <small class="message-time">${now}</small>
`;

chatBox.appendChild(aiMessage);

  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}
function clearChat() {
  const chatBox = document.getElementById("chatBox");
chatHistory = [];

localStorage.removeItem("herRiseChatHistory");

  chatBox.innerHTML = `
    <p style="color:#e8a9c2;">
      ✧ Your AI is ready to chat!
    </p>
  `;
}

const aiName = localStorage.getItem("herRiseAIName") || "HerRise AI";
document.getElementById("assistantName").textContent =
  "Chatting with " + aiName + " ✧";

// Restore saved chat language
const savedLanguage = localStorage.getItem("herRiseChatLanguage");

if (savedLanguage) {
  document.getElementById("chatLanguage").value = savedLanguage;
}
// Restore saved chat history
const savedChat = JSON.parse(
  localStorage.getItem("herRiseChatHistory") || "[]"
);

const chatBox = document.getElementById("chatBox");

savedChat.forEach(item => {
  const messageElement = document.createElement("div");

  messageElement.className =
    "chat-message " +
    (item.sender === "You" ? "user-bubble" : "ai-bubble");

  messageElement.innerHTML = `
    <span>${escapeHTML(item.message)}</span>
    <small class="message-time">${item.time || ""}</small>
  `;

  chatBox.appendChild(messageElement);
});

</script>

</body>
</html>
